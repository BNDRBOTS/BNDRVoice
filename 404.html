<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="application-version" content="3.2.0">
  <title>Page not found · BNDR VoiceEngine</title>
  <link rel="stylesheet" href="assets/error.css">
  <script src="config.js"></script>
</head>
<body data-error-status="404">
  <main>
    <img class="brand" src="assets/bndr-logo.png" width="797" height="230" alt="BNDR LLC">
    <p class="code">ERROR 404</p>
    <h1>Wrong frequency.</h1>
    <p>This address does not exist. The VoiceEngine is intact; the route is not.</p>
    <p class="code" id="errorCode">NAV-404-0000</p>
    <p>If this looks wrong, report it. The report is already filled in — you do not need to type anything.</p>
    <p>Send to <strong id="supportAddress">bndr.labs@gmail.com</strong></p>
    <textarea id="errorCopy" aria-label="Error report" readonly rows="8" style="width:100%;margin:0 0 16px;padding:12px;border-radius:8px;background:#0e0e0f;color:#f4f1ec;border:1px solid #29292c;font:12px/1.5 'Space Mono',monospace;"></textarea>
    <p>
      <a href="index.html">Return home</a>
      <button type="button" id="reportBtn" style="margin-left:8px;display:inline-flex;padding:12px 20px;border-radius:8px;background:transparent;color:#f4f1ec;border:1px solid #29292c;font-weight:700;cursor:pointer;">Report this</button>
      <button type="button" id="copyBtn" style="margin-left:8px;display:inline-flex;padding:12px 20px;border-radius:8px;background:transparent;color:#f4f1ec;border:1px solid #29292c;font-weight:700;cursor:pointer;">Copy report</button>
    </p>
  </main>
  <script src="assets/error-report.js"></script>
</body>
</html>
