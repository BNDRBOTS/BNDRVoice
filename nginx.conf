server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Gzip ─────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/html text/css application/javascript
                      application/json image/svg+xml font/woff2;

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options   "nosniff"                       always;
    add_header X-XSS-Protection         "1; mode=block"                 always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # ── Health check (Railway liveness probe) ─────────────────────
    location = /health {
        access_log  off;
        return      200 "ok\n";
        add_header  Content-Type text/plain;
    }

    # ── Main app ──────────────────────────────────────────────────
    # No caching — ensures users always get the latest HTML on deploy
    location / {
        try_files   $uri $uri/ /index.html;
        add_header  Cache-Control "no-cache, no-store, must-revalidate";
        add_header  Pragma        "no-cache";
        add_header  Expires       "0";
    }

    # ── Static assets (fonts, etc.) ───────────────────────────────
    # Cache aggressively — these come from CDNs anyway
    location ~* \.(woff2?|ttf|eot|otf|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
    }

    # ── Disable access to hidden files ────────────────────────────
    location ~ /\. {
        deny all;
    }
}
