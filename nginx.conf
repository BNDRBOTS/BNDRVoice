server {
    listen ${PORT} default_server;
    listen [::]:${PORT} default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security and release headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-BNDR-Release "3.1.0" always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://sdokwqjudvxeimbzsnqc.supabase.co https://api.anthropic.com https://api.openai.com https://api.gumroad.com; form-action 'self' https://buy.stripe.com; upgrade-insecure-requests" always;

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck endpoint (Railway)
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","release":"3.1.0"}';
    }

    # Clean URLs: /app -> app.html, /privacy -> privacy.html, /terms -> terms.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Missing assets must stay 404; silently returning index.html hides defects.
}
